<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARU Addons Admin</title>
<style>
:root{--bg:#f6f8fb;--panel:#fff;--text:#172033;--muted:#68748b;--line:#dfe5ef;--accent:#4f8cff;--accent2:#2367e8;--danger:#b23a3a;--max:920px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}.wrap{width:min(var(--max),calc(100% - 30px));margin:40px auto 70px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 12px 40px rgba(40,57,85,.08)}h1{margin:0 0 6px;font-size:32px;letter-spacing:-.04em}.sub{margin:0 0 24px;color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:800}input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font:inherit;color:var(--text);background:#fff;outline:none}input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.12)}textarea{min-height:110px;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:11px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#eef4ff;color:var(--accent2)}.danger{background:#fff0f0;color:var(--danger)}.status{margin-top:14px;min-height:24px;color:var(--muted);font-size:13px}.hidden{display:none}.history{display:grid;gap:10px;margin-top:8px}.history-item{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fafbfe}.history-grid{display:grid;grid-template-columns:130px 150px 1fr auto;gap:8px;align-items:start}.history-grid input{background:#fff}.login{max-width:460px;margin:70px auto}.small{font-size:12px;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.history-grid{grid-template-columns:1fr 1fr}.history-grid input:nth-child(3){grid-column:1/-1}.history-grid button{grid-column:1/-1}}
</style>
</head>
<body>
<div id="loginView" class="wrap login"><div class="card"><h1>MARU Addons Admin</h1><p class="sub">更新情報・注意書き・バージョン履歴を管理します。</p><div class="field"><label for="password">管理パスワード</label><input id="password" type="password" autocomplete="current-password"></div><div class="row"><button class="primary" id="loginBtn">ログイン</button></div><div class="status" id="loginStatus"></div></div></div>
<div id="adminView" class="wrap hidden"><div class="card"><h1>MARU Addons Admin</h1><p class="sub">公開ページの更新情報をここから保存できます。</p><div class="grid">
<div class="field"><label for="version">現在のバージョン</label><input id="version" placeholder="v1.5.0"></div>
<div class="field"><label for="versionNote">バージョンの説明</label><input id="versionNote" placeholder="Scratch向け / コンソール実行対応"></div>
<div class="field full"><label for="notice">お知らせ</label><textarea id="notice"></textarea></div>
<div class="field full"><label for="warning">注意書き</label><textarea id="warning"></textarea></div>
<div class="field full"><label>更新履歴</label><div id="history" class="history"></div></div>
</div><div class="row"><button class="secondary" id="addHistoryBtn">履歴を追加</button><button class="primary" id="saveBtn">保存する</button><button class="danger" id="logoutBtn">ログアウト</button></div><div class="status" id="adminStatus"></div><p class="small">保存するとGitHubの <code>site-data.json</code> が更新され、公開ページに反映されます。</p></div></div>
<script>
const WORKER_URL="https://maru-addons-admin.maru-0727.workers.dev";
let token="";
const $=id=>document.getElementById(id);
function setStatus(id,text){$(id).textContent=text;}
function addHistory(item={version:"",date:"",text:""}){const box=document.createElement("div");box.className="history-item";box.innerHTML=`<div class="history-grid"><input class="hv" placeholder="v1.5.0"><input class="hd" placeholder="2026-09-02"><input class="ht" placeholder="更新内容"><button class="danger remove">削除</button></div>`;box.querySelector(".hv").value=item.version||"";box.querySelector(".hd").value=item.date||"";box.querySelector(".ht").value=item.text||"";box.querySelector(".remove").onclick=()=>box.remove();$("history").appendChild(box)}
function collectHistory(){return [...document.querySelectorAll(".history-item")].map(el=>({version:el.querySelector(".hv").value.trim(),date:el.querySelector(".hd").value.trim(),text:el.querySelector(".ht").value.trim()})).filter(x=>x.version||x.text)}
async function loadData(){setStatus("adminStatus","読み込み中...");const r=await fetch(`${WORKER_URL}/site-data?cb=${Date.now()}`,{cache:"no-store"});if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();$("version").value=d.version||"";$("versionNote").value=d.versionNote||"";$("notice").value=d.notice||"";$("warning").value=d.warning||"";$("history").innerHTML="";(d.history||[]).forEach(addHistory);setStatus("adminStatus","読み込み完了")}
$("loginBtn").onclick=async()=>{try{setStatus("loginStatus","認証中...");const r=await fetch(`${WORKER_URL}/admin/login`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("password").value})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"ログインに失敗しました");token=d.token;sessionStorage.setItem("maruAddonsAdminToken",token);$("loginView").classList.add("hidden");$("adminView").classList.remove("hidden");await loadData()}catch(e){setStatus("loginStatus",e.message)}};
$("addHistoryBtn").onclick=()=>addHistory({version:"",date:new Date().toISOString().slice(0,10),text:""});
$("saveBtn").onclick=async()=>{try{setStatus("adminStatus","保存中...");const siteData={version:$("version").value.trim(),versionNote:$("versionNote").value.trim(),notice:$("notice").value.trim(),warning:$("warning").value.trim(),history:collectHistory()};const r=await fetch(`${WORKER_URL}/admin/save`,{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`},body:JSON.stringify({siteData})});const d=await r.json();if(!r.ok||!d.success){if(r.status===401)sessionStorage.removeItem("maruAddonsAdminToken");throw new Error(d.message||"保存に失敗しました")}setStatus("adminStatus","保存しました！公開ページを更新すると反映されます。") }catch(e){setStatus("adminStatus",e.message)}};
$("logoutBtn").onclick=()=>{token="";sessionStorage.removeItem("maruAddonsAdminToken");location.reload()};
(async()=>{token=sessionStorage.getItem("maruAddonsAdminToken")||"";if(!token)return;$("loginView").classList.add("hidden");$("adminView").classList.remove("hidden");try{await loadData()}catch(e){sessionStorage.removeItem("maruAddonsAdminToken");location.reload()}})();
</script>
</body>
</html>
