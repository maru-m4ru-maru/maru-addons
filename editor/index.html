<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f8fb">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236b4eff'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial,sans-serif' font-size='38' font-weight='900' fill='white'%3ES%3C/text%3E%3C/svg%3E">
<title>MARU Addons — 編集</title>
<style>
:root{--bg:#eef2f7;--panel:#fff;--text:#172033;--muted:#68748b;--line:#dfe5ef;--accent:#4f8cff;--accent2:#2367e8;--orange:#f39a2d;--danger:#b23a3a;--shadow:0 14px 40px rgba(35,53,84,.09)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand-mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:#6b4eff;color:#fff;font-weight:900}.tools{display:flex;align-items:center;gap:8px}.status{font-size:13px;color:var(--muted);margin-right:4px}.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:9px 13px;font:inherit;font-weight:800;cursor:pointer}.btn:hover{background:#f7f9fc}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:calc(100vh - 66px)}.preview{padding:24px;overflow:auto}.preview-shell{max-width:1120px;margin:0 auto;background:#f6f8fb;border:1px solid #dbe2ec;border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.site{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f6f8fb}.nav{padding:14px 20px;background:rgba(246,248,251,.96);border-bottom:1px solid #dfe5ef}.nav-inner{display:flex;justify-content:space-between;align-items:center}.brand2{font-weight:900}.nav-links2{display:flex;gap:14px;color:#68748b;font-size:12px}.hero{padding:60px 28px 28px}.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}.card{background:#fff;border:1px solid #dfe5ef;border-radius:20px;box-shadow:0 14px 35px rgba(35,53,84,.07)}.hero-main{padding:40px}.eyebrow{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef4ff;color:#2367e8;font-size:11px;font-weight:900}.hero h1{font-size:clamp(36px,5vw,62px);line-height:.98;margin:17px 0 12px;letter-spacing:-.06em}.orange{color:var(--orange)}.lead{color:#68748b;margin:0;max-width:700px;line-height:1.65}.side{padding:23px}.label{font-size:11px;color:#68748b;font-weight:900}.ver{font-size:40px;font-weight:950;letter-spacing:-.05em;margin-top:4px}.note{font-size:12px;color:#68748b}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.stat{padding:11px;border-radius:13px;background:#f8fafc;border:1px solid #dfe5ef}.stat b{display:block}.stat span{font-size:11px;color:#68748b}.section{padding:18px 28px 40px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.feature{padding:18px}.feature h3{margin:0 0 5px;font-size:16px}.feature p{margin:0;color:#68748b;font-size:12px}.updates{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel2{padding:18px}.history{display:grid;gap:7px}.history-row{padding:9px 10px;border:1px solid #dfe5ef;border-radius:11px;background:#fafbfe;font-size:12px}.history-row b{margin-right:8px}.muted2{color:#68748b}.footer2{padding:18px 28px 30px;color:#68748b;font-size:11px}.editor-outline{outline:2px dashed rgba(79,140,255,.65);outline-offset:3px;cursor:pointer}.side-panel{background:#fff;border-left:1px solid var(--line);padding:18px;overflow:auto}.side-panel h2{margin:0 0 5px}.hint{margin:0 0 18px;color:var(--muted);font-size:12px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:900}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;color:var(--text);font:inherit;outline:none}.field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.11)}textarea{min-height:88px;resize:vertical}.history-edit{display:grid;gap:9px}.hist-card{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fafbfe}.hist-card .row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.hist-card input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}.hist-card input.full{grid-column:1/-1}.remove{margin-top:7px;background:#fff0f0;color:var(--danger);border:0;border-radius:8px;padding:7px 9px;font:inherit;font-weight:800;cursor:pointer}.empty{padding:18px;text-align:center;color:var(--muted);font-size:12px}.notice-box{padding:11px 12px;border-radius:11px;background:#fff8e8;border:1px solid #f2dfaa;color:#785d1c;font-size:12px;margin-top:10px}.hidden{display:none!important}@media(max-width:1050px){.layout{grid-template-columns:1fr}.side-panel{border-left:0;border-top:1px solid var(--line)}.hero-grid,.updates{grid-template-columns:1fr}}@media(max-width:680px){.preview{padding:10px}.grid{grid-template-columns:1fr}.hero{padding:30px 14px 15px}.section{padding:12px 14px 25px}.hero-main{padding:28px 20px}.tools .status{display:none}}
</style>
</head>
<body>
<header class="top"><div class="brand"><span class="brand-mark">S</span><span>MARU Addons / Editor</span></div><div class="tools"><span id="status" class="status">読み込み中…</span><button class="btn" id="backBtn">Admin</button><button class="btn primary" id="saveBtn">保存</button></div></header>
<div class="layout">
<main class="preview"><div class="preview-shell"><div id="preview" class="site"></div></div></main>
<aside class="side-panel"><h2>ページを編集</h2><p class="hint">右側の項目を変更すると、左のプレビューにすぐ反映されます。</p>
<div class="field"><label>現在のバージョン</label><input id="version" placeholder="v1.5.0"></div>
<div class="field"><label>バージョンの説明</label><input id="versionNote" placeholder="Scratch向け / コンソール実行対応"></div>
<div class="field"><label>お知らせ</label><textarea id="notice" placeholder="新しいお知らせを入力"></textarea></div>
<div class="field"><label>注意書き</label><textarea id="warning" placeholder="注意事項を入力"></textarea></div>
<div class="field"><label>更新履歴</label><div id="historyEdit" class="history-edit"></div><button class="btn" id="addHistory">＋ 履歴を追加</button></div>
<div class="notice-box">保存するとWorker経由でGitHubの <b>site-data.json</b> が更新されます。</div>
</aside></div>
<script>
const WORKER_URL="https://maru-addons-admin.maru-0727.workers.dev";
const ADMIN_URL="../admin/";
let token=sessionStorage.getItem("maruAddonsAdminToken")||"";
let data={version:"v1.4.5",versionNote:"",notice:"",warning:"",history:[]};
const $=id=>document.getElementById(id);
function setStatus(t){$("status").textContent=t}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function requireAuth(){if(!token){location.href=ADMIN_URL;return false}return true}
async function apiGet(){const r=await fetch(`${WORKER_URL}/site-data?cb=${Date.now()}`,{cache:"no-store"});if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();if(!d||typeof d!=="object")throw new Error("データ形式が不正です");return d}
function sync(){data.version=$("version").value.trim();data.versionNote=$("versionNote").value.trim();data.notice=$("notice").value;data.warning=$("warning").value;data.history=[...document.querySelectorAll(".hist-card")].map(el=>({version:el.querySelector(".hv").value.trim(),date:el.querySelector(".hd").value.trim(),text:el.querySelector(".ht").value.trim()})).filter(x=>x.version||x.text)}
function addHistory(item={version:"",date:new Date().toISOString().slice(0,10),text:""}){const el=document.createElement("div");el.className="hist-card";el.innerHTML=`<div class="row"><input class="hv" placeholder="v1.5.0"><input class="hd" placeholder="2026-09-02"><input class="ht full" placeholder="更新内容"></div><button class="remove">削除</button>`;el.querySelector(".hv").value=item.version||"";el.querySelector(".hd").value=item.date||"";el.querySelector(".ht").value=item.text||"";el.querySelector(".remove").onclick=()=>{el.remove();renderPreview()};$("historyEdit").appendChild(el)}
function collect(){sync();return data}
function renderPreview(){sync();$("preview").innerHTML=`<header class="nav"><div class="nav-inner"><div class="brand2">まる Addons</div><nav class="nav-links2"><span>Features</span><span>Install</span><span>Updates</span></nav></div></header><section class="hero"><div class="hero-grid"><div class="card hero-main"><div class="eyebrow">SCRATCH UTILITY</div><h1><span class="orange">Scratchを、</span><br>もっと便利に。</h1><p class="lead">Scratch に「ちょっと欲しかった」を追加する非公式ユーティリティ。拡張機能が使えない環境でも、DevTools のコンソールから起動できます。</p></div><aside class="card side"><div><div class="label">CURRENT VERSION</div><div class="ver">${esc(data.version||"v1.4.5")}</div><div class="note">${esc(data.versionNote||"")}</div></div><div class="stats"><div class="stat"><b>60 FPS</b><span>切替モード</span></div><div class="stat"><b>FPS</b><span>モニター</span></div><div class="stat"><b>Block</b><span>ブロック数表示</span></div><div class="stat"><b>VM</b><span>開発用アクセス</span></div></div></aside></div></section><section class="section"><h2>今ある機能</h2><div class="grid"><article class="card feature"><h3>Browser FPS</h3><p>ブラウザ側の描画フレームレートを表示。</p></article><article class="card feature"><h3>60FPS Mode</h3><p>Alt + スタートボタンで切替。</p></article><article class="card feature"><h3>ブロック数表示</h3><p>プロジェクト内のブロック数を表示。</p></article><article class="card feature"><h3>Scratch FPS</h3><p>ランタイム側のFPSを確認。</p></article></div></section><section class="section"><h2>更新情報・注意書き</h2><div class="updates"><div class="card panel2"><h3>Version History</h3><div class="history">${data.history?.length?data.history.map(x=>`<div class="history-row"><b>${esc(x.version)}</b>${esc(x.date)} <span class="muted2">${esc(x.text)}</span></div>`).join(""):"<div class='empty'>更新履歴はありません。</div>"}</div></div><div class="card panel2"><h3>お知らせ</h3><p class="muted2">${esc(data.notice||"現在、お知らせはありません。").replaceAll("\n","<br>")}</p>${data.warning?`<div class="notice-box"><b>注意:</b> ${esc(data.warning).replaceAll("\n","<br>")}</div>`:""}</div></div></section><div class="footer2">© 2026 maru_m4ru_maru · まる Addons</div>`}
async function load(){if(!requireAuth())return;try{setStatus("読み込み中…");data=await apiGet();$("version").value=data.version||"";$("versionNote").value=data.versionNote||"";$("notice").value=data.notice||"";$("warning").value=data.warning||"";$("historyEdit").innerHTML="";(data.history||[]).forEach(addHistory);renderPreview();setStatus("保存済み")}catch(e){console.error(e);sessionStorage.removeItem("maruAddonsAdminToken");setStatus("読み込み失敗");setTimeout(()=>location.href=ADMIN_URL,500)}}
["version","versionNote","notice","warning"].forEach(id=>$(id).addEventListener("input",renderPreview));
$("addHistory").onclick=()=>{sync();addHistory();renderPreview()};
$("saveBtn").onclick=async()=>{try{const payload=collect();setStatus("保存中…");const r=await fetch(`${WORKER_URL}/admin/save`,{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`},body:JSON.stringify({siteData:payload})});const d=await r.json();if(!r.ok||!d.success){if(r.status===401)sessionStorage.removeItem("maruAddonsAdminToken");throw new Error(d.message||"保存に失敗しました")}setStatus("保存しました！")}catch(e){console.error(e);setStatus(e.message)}};
$("backBtn").onclick=()=>location.href=ADMIN_URL;
load();
</script>
</body>
</html>
