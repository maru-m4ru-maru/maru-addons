<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>まる Addons - VM Test</title>
</head>
<body>
  <h1>まる Addons VM Test</h1>

  <p id="status">VMを探しています...</p>

  <script>
    const status = document.getElementById("status");

    function findVM() {
      const el = document.querySelector('[class*="stage-wrapper"]');

      if (!el) return null;

      const entry = Object.entries(el).find(([key]) => /Fiber/.test(key));

      if (!entry) return null;

      let fiber = entry[1];

      while (fiber && !fiber.pendingProps?.vm) {
        fiber = fiber.return;
      }

      return fiber?.pendingProps?.vm || null;
    }

    const vm = findVM();

    if (vm) {
      status.textContent =
        "VM FOUND! targets: " +
        (vm.runtime?.targets?.length ?? 0);

      console.log("[まる Addons] VM FOUND!", vm);
    } else {
      status.textContent =
        "VMは取得できませんでした。";

      console.log("[まる Addons] VM NOT FOUND");
    }
  </script>
</body>
</html>
